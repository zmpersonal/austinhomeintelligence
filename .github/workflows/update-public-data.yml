name: Update Austin public data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_public_data.py
      - name: Commit changed public data
        run: |
          if git diff --quiet data/live-signals.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-signals.json
          git commit -m "Update Austin public risk signals"
          git push
