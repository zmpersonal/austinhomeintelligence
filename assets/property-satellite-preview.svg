<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Illustrated satellite property view">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56724f"/><stop offset=".5" stop-color="#6f865c"/><stop offset="1" stop-color="#405d48"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#aaa49a"/><stop offset=".6" stop-color="#77766f"/><stop offset="1" stop-color="#575c59"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#777a74"/><stop offset="1" stop-color="#595e59"/></linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7cc8d4"/><stop offset="1" stop-color="#3b94a6"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#173128" flood-opacity=".3"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="lawn" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r="1" fill="#99a97b" opacity=".25"/><circle cx="14" cy="13" r="1.2" fill="#273e32" opacity=".2"/></pattern>
  </defs>
  <rect width="900" height="560" fill="#51654c"/>
  <rect width="900" height="560" fill="url(#grass)"/>
  <rect width="900" height="560" fill="url(#lawn)"/>

  <!-- road + curb -->
  <path d="M-10 430C190 394 349 417 503 458c154 40 287 35 420 3v119H-10Z" fill="url(#road)"/>
  <path d="M-5 428c200-37 355-14 509 27 153 41 284 37 416 3" fill="none" stroke="#d5d0c3" stroke-width="9" opacity=".8"/>

  <!-- neighboring roofs -->
  <g opacity=".72">
    <path d="M-35 55 142 9l93 83-47 118-176 22-60-93Z" fill="#645f59"/><path d="M674-30 885 18l47 151-144 66-128-80Z" fill="#69665f"/>
  </g>

  <!-- parcel boundary -->
  <path d="M226 58 675 88l93 359-511-44Z" fill="#e8e1c6" fill-opacity=".065" stroke="#f3e696" stroke-width="3" stroke-dasharray="11 9"/>

  <!-- house shadow -->
  <path d="M318 173 565 145l91 79-36 172-282-21-54-93Z" fill="#20302a" opacity=".28"/>
  <!-- house footprint -->
  <path d="M308 149 557 128l88 74-28 173-276-20-54-88Z" fill="url(#roof)"/>
  <path d="M308 149 459 120l98 8-8 108-134 13-4 112-70-6-54-88Z" fill="#99958c" opacity=".74"/>
  <path d="M415 249 549 235l68 41-10 99-196-14Z" fill="#77756e"/>
  <!-- roof ridges/vents -->
  <g stroke="#d7d2c7" stroke-opacity=".45" stroke-width="3"><path d="M459 120 415 249"/><path d="M549 235 557 128"/><path d="M415 249 607 375"/><path d="M341 355 415 249"/></g>
  <g fill="#414844"><rect x="470" y="167" width="18" height="24" rx="4"/><rect x="513" y="159" width="16" height="21" rx="4"/><rect x="364" y="214" width="14" height="18" rx="4"/></g>

  <!-- driveway -->
  <path d="M575 359 716 380l58 66-178-15Z" fill="#aaa99f" opacity=".9"/><path d="M600 386 740 403" stroke="#d8d4c8" stroke-width="2" opacity=".55"/>
  <!-- pool -->
  <path d="M235 235c0-30 19-48 50-49l51-1c32 0 49 18 49 48v65c0 29-18 45-49 44l-54-2c-31-1-47-19-47-47Z" fill="#d7d2c5"/>
  <path d="M249 239c0-23 14-37 38-38l44-1c25 0 38 14 38 37v55c0 22-14 34-38 33l-46-2c-24-1-36-14-36-36Z" fill="url(#pool)"/>
  <path d="M259 250c24 8 69 8 99 0M259 278c27 8 71 8 99 0" stroke="#c9eef1" stroke-width="2" opacity=".45"/>

  <!-- trees -->
  <g>
    <g transform="translate(165 149)"><circle r="57" fill="#264d37"/><circle cx="-20" cy="-8" r="34" fill="#46704a"/><circle cx="24" cy="-17" r="37" fill="#587b50"/><circle cx="7" cy="23" r="41" fill="#345f42"/></g>
    <g transform="translate(706 175)"><circle r="61" fill="#274b35"/><circle cx="-20" cy="-10" r="38" fill="#4d7147"/><circle cx="22" cy="-15" r="38" fill="#627f50"/><circle cx="9" cy="25" r="43" fill="#355c3f"/></g>
    <g transform="translate(170 335)"><circle r="45" fill="#2e5639"/><circle cx="-15" cy="-8" r="27" fill="#53774a"/><circle cx="17" cy="-10" r="29" fill="#688550"/></g>
    <g transform="translate(762 318)"><circle r="49" fill="#2c5238"/><circle cx="-16" cy="-7" r="31" fill="#55774a"/><circle cx="18" cy="-11" r="31" fill="#6d8953"/></g>
  </g>

  <!-- property marker -->
  <g transform="translate(464 247)">
    <circle r="34" fill="#e96d48" fill-opacity=".13"/><circle r="18" fill="#f08a54"/>
    <path d="M0-10 10-2V10H-10V-2Z" fill="#fffaf0"/><rect x="-2.2" y="3" width="4.4" height="7" fill="#f3c66b"/>
  </g>

  <!-- UI overlay -->
  <g transform="translate(34 32)">
    <rect width="262" height="72" rx="15" fill="#f9f7f0"/>
    <circle cx="35" cy="36" r="15" fill="#123f34"/><path d="M28 37 35 31l7 6v7H28Z" fill="#fff"/>
    <text x="62" y="29" fill="#10231f" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800">YOUR PROPERTY VIEW</text>
    <text x="62" y="50" fill="#60716b" font-family="Inter,Arial,sans-serif" font-size="12">Confirm the home, then mark concerns</text>
  </g>
  <g transform="translate(635 42)"><rect width="222" height="38" rx="19" fill="#0b2f27" fill-opacity=".88"/><circle cx="20" cy="19" r="5" fill="#b9df78"/><text x="36" y="24" fill="#edf5ef" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="750">SATELLITE PROPERTY CONTEXT</text></g>
</svg>
