<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-label="Austin-specific home intelligence data illustration">
  <defs>
    <linearGradient id="bg" x1="70" y1="20" x2="690" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#184f41"/><stop offset=".55" stop-color="#103b31"/><stop offset="1" stop-color="#082a23"/>
    </linearGradient>
    <linearGradient id="river" x1="75" y1="350" x2="680" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9fd6ca"/><stop offset=".45" stop-color="#cfebdb"/><stop offset="1" stop-color="#78b8aa"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#f3bd67"/><stop offset="1" stop-color="#e96d48"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#061e19" flood-opacity=".28"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/></pattern>
  </defs>
  <rect x="8" y="8" width="744" height="604" rx="40" fill="url(#bg)"/>
  <rect x="8" y="8" width="744" height="604" rx="40" fill="url(#grid)"/>

  <g opacity=".22" fill="none" stroke="#d9eee6" stroke-width="1.5">
    <path d="M-10 105C126 23 215 176 349 96S596 35 786 118"/>
    <path d="M-30 155C105 84 230 220 376 143S607 97 790 175"/>
    <path d="M-20 211C104 128 251 280 403 202S625 157 790 230"/>
    <path d="M-15 270C112 184 281 328 433 263S646 222 792 288"/>
    <path d="M-12 333C112 251 279 384 452 329S651 293 787 351"/>
    <path d="M-5 399C129 319 294 445 463 399S662 365 789 420"/>
    <path d="M20 466C151 399 310 496 483 466S670 439 778 487"/>
  </g>

  <text x="54" y="70" fill="#bad0c8" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="3">AUSTIN HOME INTELLIGENCE</text>
  <text x="54" y="116" fill="#f8f4ea" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="-1.3">Built for Austin homes.</text>
  <text x="54" y="150" fill="#c8dad4" font-family="Inter,Arial,sans-serif" font-size="17">Local property context, current public signals and your answers.</text>

  <!-- abstract Austin map / river -->
  <g transform="translate(58 184)">
    <path d="M23 66c39-27 74-31 110-16 33 14 56 4 80-14 35-27 74-26 106-3 28 19 57 20 93 2 43-22 84-16 129 21 33 27 72 33 111 17" fill="none" stroke="#6f9f90" stroke-opacity=".55" stroke-width="4"/>
    <path d="M0 188c62-17 110-8 154 24 46 34 94 38 152 7 53-29 103-25 151 7 49 32 100 39 180 8" fill="none" stroke="url(#river)" stroke-width="15" stroke-linecap="round" opacity=".9"/>
    <path d="M3 188c64-16 109-6 153 25 46 32 94 36 151 7 53-27 103-23 150 8 50 31 101 36 180 6" fill="none" stroke="#f7f2e8" stroke-opacity=".38" stroke-width="2.2" stroke-linecap="round"/>
    <g fill="none" stroke="#d8e8e2" stroke-opacity=".22" stroke-width="2">
      <path d="M56 13 85 87l-31 83 42 106"/><path d="M134 8 153 85l-20 68 23 116"/><path d="M223 5 210 97l35 62-19 119"/><path d="M320 6 290 88l48 77-22 119"/><path d="M421 10 396 92l44 62-9 128"/><path d="M525 12 492 98l50 58 4 123"/>
    </g>
    <!-- radar -->
    <g transform="translate(391 106)">
      <circle r="75" fill="#b9df78" opacity=".06"/><circle r="55" fill="none" stroke="#b9df78" stroke-opacity=".42" stroke-width="2"/><circle r="34" fill="none" stroke="#b9df78" stroke-opacity=".58" stroke-width="2"/><circle r="13" fill="#b9df78" opacity=".18"/>
      <circle r="6.5" fill="#c9ed89"/><circle r="18" fill="#c9ed89" opacity=".11" filter="url(#glow)"/>
      <path d="M0 0 54-28" stroke="#b9df78" stroke-width="2" stroke-linecap="round" opacity=".65"/>
    </g>
    <!-- property pin -->
    <g transform="translate(391 106)">
      <path d="M0-27c-12.3 0-22.2 9.9-22.2 22.2C-22.2 11.5 0 34 0 34S22.2 11.5 22.2-4.8C22.2-17.1 12.3-27 0-27Z" fill="#f08a54"/>
      <path d="M-9-6.8 0-14l9 7.2V5H-9Z" fill="#fff8ed"/><rect x="-2.4" y="-1" width="4.8" height="6" fill="#f6c96b"/>
    </g>
  </g>

  <!-- refresh status -->
  <g transform="translate(54 498)">
    <rect width="232" height="46" rx="23" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".13"/>
    <circle cx="23" cy="23" r="7" fill="#b9df78"/><circle cx="23" cy="23" r="12" fill="#b9df78" opacity=".10"/>
    <text x="43" y="19" fill="#f8f4ea" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">CURRENT DATA SOURCES</text>
    <text x="43" y="34" fill="#bcd1c9" font-family="Inter,Arial,sans-serif" font-size="11">Weather + public Austin context</text>
  </g>

  <g font-family="Inter,Arial,sans-serif" font-size="12" font-weight="750">
    <g transform="translate(306 497)"><rect width="76" height="34" rx="17" fill="#f7f2e8" fill-opacity=".10"/><text x="38" y="21" text-anchor="middle" fill="#d9e8e2">HEAT</text></g>
    <g transform="translate(390 497)"><rect width="72" height="34" rx="17" fill="#f7f2e8" fill-opacity=".10"/><text x="36" y="21" text-anchor="middle" fill="#d9e8e2">HAIL</text></g>
    <g transform="translate(470 497)"><rect width="98" height="34" rx="17" fill="#f7f2e8" fill-opacity=".10"/><text x="49" y="21" text-anchor="middle" fill="#d9e8e2">CLAY SOIL</text></g>
    <g transform="translate(576 497)"><rect width="90" height="34" rx="17" fill="#f7f2e8" fill-opacity=".10"/><text x="45" y="21" text-anchor="middle" fill="#d9e8e2">WATER</text></g>
    <g transform="translate(674 497)"><rect width="54" height="34" rx="17" fill="url(#orange)"/><text x="27" y="21" text-anchor="middle" fill="#17342c">PESTS</text></g>
  </g>

  <text x="54" y="580" fill="#aec6bd" font-family="Inter,Arial,sans-serif" font-size="13">Local conditions + property data + homeowner answers</text>
</svg>
